[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crimsonos"
version = "0.1.1"
description = "Crimson OS protocol scaffold — routing, tokens, bridge format, IG audit shapes (SCAFFOLDING; not the full runtime)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Gibson", email = "crimson@crimsonsymphonymedia.com" }
]
keywords = [
    "multi-agent",
    "ai",
    "autonomous",
    "dispatcher",
    "token-ring",
    "sovereign",
    "local-inference",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
biometric = [
    "mne>=1.6",
    "zuna>=0.1",
]
inference = [
    "torch>=2.0",
    "transformers>=4.35",
]

[project.urls]
Homepage = "https://github.com/ultranetcommand-neo/Crimson-OS"
Documentation = "https://github.com/ultranetcommand-neo/Crimson-OS/tree/main/runtime/crimsonos/docs"
Repository = "https://github.com/ultranetcommand-neo/Crimson-OS"
"Bug Tracker" = "https://github.com/ultranetcommand-neo/Crimson-OS/issues"
"Technical Paper" = "https://x.com/MattGibsonMusic"

[project.scripts]
crimsonos = "crimsonos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
